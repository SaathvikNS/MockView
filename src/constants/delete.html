<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="margin:0; padding:0; background: linear-gradient(135deg, #0f172a, #1e293b);">
  <table width="100%" border="0" cellspacing="0" cellpadding="0" style="padding: 40px 20px;">
    <tr>
      <td align="center">
        <table width="100%" border="0" cellspacing="0" cellpadding="0"
          style="max-width: 600px; background: #ffffff; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.2); font-family: 'Segoe UI', Helvetica, Arial, sans-serif;">

          <!-- Header -->
          <tr>
            <td align="center" style="padding: 40px 30px 20px 30px;">
              <h1 style="margin:0; font-size: 26px; color: #0f172a; font-weight: 700;">
                Sign in to MockView
              </h1>
              <p style="margin: 10px 0 0 0; font-size: 15px; color: #64748b;">
                Click the button below to securely access your account.
              </p>
            </td>
          </tr>

          <!-- Button -->
          <tr>
            <td align="center" style="padding: 30px;">
              <table border="0" cellspacing="0" cellpadding="0">
                <tr>
                  <td align="center" bgcolor="#2563eb" 
                      style="border-radius: 10px;">
                    <a href="${url}" target="_blank"
                      style="display: inline-block; padding: 14px 28px;
                             font-size: 16px; font-weight: 600;
                             color: #ffffff; text-decoration: none;
                             border-radius: 10px;">
                      🚀 Sign In Securely
                    </a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Divider -->
          <tr>
            <td style="padding: 0 40px;">
              <hr style="border: none; border-top: 1px solid #e2e8f0;">
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td align="center"
              style="padding: 20px 40px 40px 40px; font-size: 13px; line-height: 20px; color: #94a3b8;">
              If you did not request this email, you can safely ignore it.<br>
              This link will expire for security reasons.
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
